name: Oyunca APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'oyunca-gt-*.zip'
      - '.github/workflows/oyunca-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: android-actions/setup-android@v3
      - name: Araçlar
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install --break-system-packages protobuf grpcio-tools
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "cmake;3.22.1"
      - name: GameTranslator kaynağı
        run: git clone --depth 1 https://gitlab.com/sefflex/GameTranslator.git src
      - name: chiaki-ng
        run: |
          git clone --depth 1 --branch v1.10.1 --recurse-submodules --shallow-submodules https://github.com/streetpea/chiaki-ng src/third-party/chiaki-ng \
          || git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/streetpea/chiaki-ng src/third-party/chiaki-ng
      - name: Yamayı uygula
        working-directory: src
        run: |
          unzip -o ../oyunca-gt-*.zip -d .
          python3 oyunca/patch.py
      - name: Derle
        working-directory: src/mobile
        env:
          GT_PYTHON: python3
          GT_PROTOC: protoc
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Oyunca-apk
          path: src/mobile/build/app/outputs/flutter-apk/*.apk
